services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: fixcore
      POSTGRES_USER: fixcore_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - fixcore-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixcore_user -d fixcore"]
      interval: 10s
      retries: 5

  backend:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://database:5432/fixcore
      DB_USERNAME: fixcore_user
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - "8080:8080"

volumes:
  fixcore-data:
