spring.application.name=FixCoreBackend
spring.profiles.default=dev

spring.jpa.hibernate.naming.physical-strategy=com.techmakers.fixcore.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

documentation.application.description=FixCore maintenance management platform REST API
documentation.application.version=v1
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

fixcore.seed.demo-plants.enabled=false
fixcore.seed.demo-assets.enabled=false
fixcore.seed.demo-maintenance-plans.enabled=false
fixcore.seed.demo-spare-parts.enabled=false
fixcore.seed.demo-stock-movements.enabled=false
fixcore.seed.demo-failures.enabled=false
fixcore.seed.demo-work-orders.enabled=false
fixcore.seed.demo-users.enabled=false
fixcore.seed.demo-users.password=${DEMO_USERS_PASSWORD:FixCore2026}

fixcore.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://fixcore-frontend-eight.vercel.app}
